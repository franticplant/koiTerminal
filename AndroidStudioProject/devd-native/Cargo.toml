[package]
name = "koi-devd-native"
description = "devd's network side in Rust: listeners, TLS 1.3 with client certificates (rustls), framing; requests and signing go to Kotlin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.99"

[lib]
# Loaded by Kotlin as System.loadLibrary("koi_devd").
name = "koi_devd"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22.4"
# ring, not the default aws-lc-rs: ring cross-compiles with the NDK alone.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
