# Everything a koiTerminal build needs, shared by CI and the release workflow:
# JDK 21, the Android SDK packages and NDK from build/toolchain.lock, the Rust
# toolchain from AndroidStudioProject/rust/rust-toolchain.toml, cargo-ndk, and
# caches. CI runs the tools directly (KOI_HOST_TOOLCHAIN=1); locally
# scripts/run uses the same pinned list in build/Containerfile.
name: Set up koiTerminal build
description: Pinned JDK, Android SDK/NDK, Rust and cargo tools, and build caches.

inputs:
  cache:
    description: Restore and save the cargo and Gradle caches.
    default: "true"
  signing-only:
    description: Only what signing and the release check need (JDK, build-tools).
    default: "false"

runs:
  using: composite
  steps:
    - name: Read toolchain.lock
      id: lock
      shell: bash
      run: |
        set -a; . build/toolchain.lock; set +a
        channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' AndroidStudioProject/rust/rust-toolchain.toml)
        if [[ "$channel" != "$RUST_TOOLCHAIN" ]]; then
          echo "::error::rust-toolchain.toml ($channel) and build/toolchain.lock ($RUST_TOOLCHAIN) disagree"
          exit 1
        fi
        {
          echo "jdk=$JDK_MAJOR"
          echo "ndk=$ANDROID_NDK"
          echo "hash=$(cat build/toolchain.lock build/install-cargo-tools.sh AndroidStudioProject/rust/rust-toolchain.toml | sha256sum | cut -c1-16)"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: ${{ steps.lock.outputs.jdk }}

    - name: Cache Android NDK
      if: inputs['signing-only'] != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/lib/android/sdk/ndk/${{ steps.lock.outputs.ndk }}
        key: android-ndk-${{ runner.os }}-${{ steps.lock.outputs.ndk }}

    - name: Android SDK packages
      shell: bash
      run: |
        . build/toolchain.lock
        pkgs=("$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS")
        if [[ "${{ inputs['signing-only'] }}" != true && ! -d "$ANDROID_HOME/ndk/$ANDROID_NDK" ]]; then
          pkgs+=("ndk;$ANDROID_NDK")
        fi
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        (yes | "$sdkmanager" --licenses > /dev/null) || true
        "$sdkmanager" --install "${pkgs[@]}" > /dev/null
        # Both names: the runner image sets ANDROID_NDK_ROOT to its own NDK.
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK" >> "$GITHUB_ENV"
        echo "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS" >> "$GITHUB_PATH"

    - name: Cache Rust toolchain and cargo tools
      if: inputs['signing-only'] != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.rustup/toolchains
          ~/.rustup/update-hashes
          ~/.koi-tools
        key: rust-tools-${{ runner.os }}-${{ steps.lock.outputs.hash }}

    - name: musl tools for koi-ctl
      if: inputs['signing-only'] != 'true'
      shell: bash
      run: |
        . build/toolchain.lock
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends "musl-tools=$MUSL_TOOLS_UBUNTU"

    - name: Rust toolchain and cargo tools
      if: inputs['signing-only'] != 'true'
      shell: bash
      run: |
        rustup toolchain install 1.99.1 --profile minimal \
          --component rustfmt --component clippy \
          --target aarch64-linux-android --target x86_64-linux-android \
          --target x86_64-unknown-linux-musl
        rustc --version
        [[ -x ~/.koi-tools/cargo-ndk ]] || \
          build/install-cargo-tools.sh build/toolchain.lock ~/.koi-tools
        echo "$HOME/.koi-tools" >> "$GITHUB_PATH"

    - name: Cache cargo registry and target directory
      if: inputs.cache == 'true' && inputs['signing-only'] != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.cache/koi-target
        key: cargo-${{ runner.os }}-${{ steps.lock.outputs.hash }}-${{ hashFiles('dev/ctl/Cargo.lock', 'AndroidStudioProject/devd-native/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ steps.lock.outputs.hash }}-

    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      if: inputs['signing-only'] != 'true'
      with:
        cache-disabled: ${{ inputs.cache != 'true' }}
        cache-read-only: ${{ github.ref != 'refs/heads/koiterminal' }}

    - name: Use the host toolchain
      shell: bash
      run: |
        # Every cargo call uses the pinned toolchain, not the runner's default
        # stable: only AndroidStudioProject/rust has a rust-toolchain.toml, and
        # devd-native and koi-ctl live outside it.
        . build/toolchain.lock
        {
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
          echo "KOI_HOST_TOOLCHAIN=1"
          echo "KOI_CACHE_DIR=$RUNNER_TEMP/koi-cache"
          echo "CARGO_TARGET_DIR=$HOME/.cache/koi-target"
        } >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/koi-cache"
