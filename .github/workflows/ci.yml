# Every pull request, and every push to the integration branch: build the app
# (dev and prod), devd and koi-ctl, run the release checks on both flavors, the
# Rust/Kotlin tests, and lint the workflows. Feature branches are built through
# their pull request only, so each change builds once. Nothing here can read
# the signing keys: they live in the "release" environment, which only admits
# v* tags (see release.yml).
#
# No build container in CI: .github/actions/setup-build installs the same
# pinned tools on the runner, and scripts/run uses them directly. The toolchain
# list is build/toolchain.lock; repository builds use build/Containerfile.
name: CI

on:
  push:
    branches: [koiterminal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      # One commit is enough: the version comes from HEAD's time and hash.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build

      - name: Rust format (koi-ctl)
        run: scripts/run cargo fmt --manifest-path dev/ctl/Cargo.toml -- --check
      - name: Rust lints (koi-ctl)
        run: scripts/run cargo clippy --manifest-path dev/ctl/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust tests (koi-ctl)
        run: scripts/run cargo test --manifest-path dev/ctl/Cargo.toml --locked
      - name: Rust lints and tests (devd native)
        run: |
          scripts/run cargo clippy --manifest-path AndroidStudioProject/devd-native/Cargo.toml --all-targets --locked -- -D warnings
          scripts/run cargo test --manifest-path AndroidStudioProject/devd-native/Cargo.toml --locked

      - name: Build unsigned APKs (dev, prod, devd)
        run: scripts/build all

      - name: Kotlin unit tests and lint
        run: scripts/run ./AndroidStudioProject/gradlew -p AndroidStudioProject --console=plain :app:testDevDebugUnitTest :devapi:testDebugUnitTest :devd:testDebugUnitTest lintDevRelease lintProdRelease :devd:lintRelease

      - name: Release check (prod has no dev pieces)
        run: scripts/run scripts/check-release-apk.sh --unsigned AndroidStudioProject/app/build/outputs/apk/prod/release/*.apk
      - name: Release check, inverted (dev still trips it)
        run: scripts/run scripts/check-release-apk.sh --unsigned --expect-dev AndroidStudioProject/app/build/outputs/apk/dev/release/*.apk
      - name: Release check (devd)
        run: scripts/run scripts/check-release-apk.sh --unsigned --devd AndroidStudioProject/devd/build/outputs/apk/release/*.apk

      - name: Build koi-ctl
        run: scripts/ctl
      - name: Collect unsigned APKs
        run: |
          mkdir -p dist/unsigned
          cp AndroidStudioProject/app/build/outputs/apk/dev/release/*.apk dist/unsigned/
          cp AndroidStudioProject/app/build/outputs/apk/prod/release/*.apk dist/unsigned/
          cp AndroidStudioProject/devd/build/outputs/apk/release/*.apk dist/unsigned/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apks
          path: dist/unsigned/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koi-ctl
          path: dist/koi-ctl
          retention-days: 7

  # The way release.yml builds: in the pinned container, as
  # scripts/verify-reproducible.sh does. Keeps the release path working, and its
  # outputs can be compared with a local container build of the same commit.
  container:
    name: Build in the release container
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Build unsigned APKs and koi-ctl
        run: |
          scripts/build all
          scripts/ctl
      - name: Collect
        run: |
          mkdir -p out
          cp AndroidStudioProject/app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk out/
          cp AndroidStudioProject/app/build/outputs/apk/dev/release/app-dev-release-unsigned.apk out/
          cp AndroidStudioProject/devd/build/outputs/apk/release/devd-release-unsigned.apk out/
          cp dist/koi-ctl out/
          git rev-parse HEAD > out/commit
          (cd out && sha256sum -- *)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-build
          path: out/
          retention-days: 7

  workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (pinned, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary :all: -r build/requirements-lint.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --persona regular .github/
