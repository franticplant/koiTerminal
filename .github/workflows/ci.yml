# Every push and pull request: build the app (dev and prod), devd and koi-ctl,
# run the release checks on both flavors, and the Rust/Kotlin tests. Pushes to
# the integration branch also produce signed dev APKs (release environment).
#
# No build container in CI: .github/actions/setup-build installs the same
# pinned tools on the runner, and scripts/run uses them directly. The toolchain
# list is build/toolchain.lock; repository builds use build/Containerfile.
name: CI

on:
  push:
    branches: [koiterminal, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KOI_CERT_SHA256: ${{ vars.KOI_CERT_SHA256 }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build

      - name: Rust format (koi-ctl)
        run: scripts/run cargo fmt --manifest-path dev/ctl/Cargo.toml -- --check
      - name: Rust lints (koi-ctl)
        run: scripts/run cargo clippy --manifest-path dev/ctl/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust tests (koi-ctl)
        run: scripts/run cargo test --manifest-path dev/ctl/Cargo.toml --locked
      - name: Rust lints and tests (devd native)
        run: |
          scripts/run cargo clippy --manifest-path AndroidStudioProject/devd-native/Cargo.toml --all-targets --locked -- -D warnings
          scripts/run cargo test --manifest-path AndroidStudioProject/devd-native/Cargo.toml --locked

      - name: Build unsigned APKs (dev, prod, devd)
        run: scripts/build all

      - name: Kotlin unit tests and lint
        run: scripts/run ./AndroidStudioProject/gradlew -p AndroidStudioProject --console=plain :app:testDevDebugUnitTest :devapi:testDebugUnitTest :devd:testDebugUnitTest lintDevRelease lintProdRelease :devd:lintRelease

      - name: Release check (prod has no dev pieces)
        run: scripts/run scripts/check-release-apk.sh --unsigned AndroidStudioProject/app/build/outputs/apk/prod/release/*.apk
      - name: Release check, inverted (dev still trips it)
        run: scripts/run scripts/check-release-apk.sh --unsigned --expect-dev AndroidStudioProject/app/build/outputs/apk/dev/release/*.apk
      - name: Release check (devd)
        run: scripts/run scripts/check-release-apk.sh --unsigned --devd AndroidStudioProject/devd/build/outputs/apk/release/*.apk

      - name: Build koi-ctl
        run: scripts/ctl
      - name: Collect unsigned APKs
        run: |
          mkdir -p dist/unsigned
          cp AndroidStudioProject/app/build/outputs/apk/dev/release/*.apk dist/unsigned/
          cp AndroidStudioProject/app/build/outputs/apk/prod/release/*.apk dist/unsigned/
          cp AndroidStudioProject/devd/build/outputs/apk/release/*.apk dist/unsigned/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apks
          path: dist/unsigned/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koi-ctl
          path: dist/koi-ctl
          retention-days: 7

  dev-apk:
    name: Build signed dev APKs
    if: github.event_name == 'push' && github.ref == 'refs/heads/koiterminal'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          signing-only: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apks
          path: unsigned
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KOI_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KOI_KEYSTORE_BASE64 is not set in the release environment"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/koi.p12"
          echo "KOI_KEYSTORE=$RUNNER_TEMP/koi.p12" >> "$GITHUB_ENV"
      - name: Sign
        env:
          KOI_KEYSTORE_PASSWORD: ${{ secrets.KOI_KEYSTORE_PASSWORD }}
          KOI_KEY_PASSWORD: ${{ secrets.KOI_KEY_PASSWORD }}
          KOI_KEY_ALIAS: ${{ vars.KOI_KEY_ALIAS }}
          KOI_CERT_SHA256: ${{ vars.KOI_CERT_SHA256 }}
        run: |
          scripts/sign dev unsigned/app-dev-release-unsigned.apk
          scripts/sign devd unsigned/devd-release-unsigned.apk
          rm -f "$RUNNER_TEMP/koi.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koi-dev-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
