[package]
name = "koi-ctl"
description = "Laptop CLI for the koiTerminal dev agent (devd): pairing, typed calls, logs, updates"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.99"

[dependencies]
# TLS 1.3 with ring, no aws-lc.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17.14"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
base64 = "0.22.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
